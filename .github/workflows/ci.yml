name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Tests run with credentials unset and in UTC (AGENTS.md).
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD^1 is the base side: of a PR's merge commit, or of main's previous commit on a push.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Reads only the checkout: no secret or local-only file is tracked.
      - if: matrix.os == 'ubuntu-latest'
        run: bun scripts/check-committed.ts
      # Reviews bun.lock against the base; does nothing unless bun.lock or package.json changed.
      - if: matrix.os == 'ubuntu-latest'
        run: bun scripts/lockfile-diff.ts HEAD^1
      # The video tests render with ffmpeg, which no runner image ships (Chrome they all do). On arm64 macOS this
      # installs the x64 build, which runs under Rosetta. Pinned past v3.1 for its Node 24 runtime.
      - uses: FedericoCarboni/setup-ffmpeg@8073ccb51e517ed576e6871c7f2360c6de4ebb7c # v3.1 + node24 (main, 2026-06-01)
        with:
          github-token: ${{ github.token }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
