<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="480" viewBox="0 0 1600 480">
  <title>Verdandi: the norn of the present, beneath Yggdrasil</title>
  <desc>
    The source of banner.png and banner-dark.png, drawn in the web UI's look (apps/web/src/styles.css,
    ui/art.tsx, ui/runes.tsx). The fonts and the engraving load by relative path, so render it in place with
    the repo's node_modules installed, at 1.5x, once in each colour scheme:
      chrome-headless-shell --allow-file-access-from-files --screenshot=banner.png --window-size=1600,480 --force-device-scale-factor=1.5 banner.svg
    and with --blink-settings=preferredColorScheme=0 added for banner-dark.png.
  </desc>
  <defs>
    <style>
      @font-face { font-family: "Crimson Pro"; font-weight: 200 900; src: url("../../apps/web/node_modules/@fontsource-variable/crimson-pro/files/crimson-pro-latin-wght-normal.woff2"); }
      @font-face { font-family: "IBM Plex Sans"; font-weight: 100 700; src: url("../../apps/web/node_modules/@fontsource-variable/ibm-plex-sans/files/ibm-plex-sans-latin-wght-normal.woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; src: url("../../apps/web/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2"); }
      svg { --bg: #efeeea; --fg: #1b1a18; --muted: #5c5953; --line: #dfddd7; --line-strong: #8a877f; --card: #ffffff; --rune: #8c4a2b; --accent: #2a5b8a; }
      .engraving { mix-blend-mode: multiply; }
      @media (prefers-color-scheme: dark) {
        svg { --bg: #151413; --fg: #eceae5; --muted: #a6a39c; --line: #353330; --line-strong: #7c7972; --card: #222120; --rune: #d08a63; --accent: #9cc3e8; }
        .engraving { mix-blend-mode: screen; opacity: 0.85; }
        .engraving image { filter: invert(1); }
      }
      .bg { fill: var(--bg); }
      .runes { fill: none; stroke: var(--rune); stroke-width: 1.5; stroke-linecap: square; stroke-linejoin: miter; }
      #plait { color: var(--rune); }
      .surface { stroke: var(--bg); }
      .eyebrow { font: 600 17px "IBM Plex Sans", sans-serif; letter-spacing: 0.12em; fill: var(--muted); }
      .title { font: 700 176px "Crimson Pro", serif; letter-spacing: -0.02em; fill: var(--fg); }
      .tag { font: 400 34px "Crimson Pro", serif; fill: var(--fg); }
    </style>
    <!-- ui/art.tsx's Plait: two ribbons crossing over, then under, each other. -->
    <pattern id="plait" width="32" height="16" patternUnits="userSpaceOnUse">
      <g fill="none">
        <path d="M0 13c5 0 11-10 16-10" stroke="currentColor" stroke-width="4.5"/>
        <path d="M0 13c5 0 11-10 16-10" class="surface" stroke-width="1.5"/>
        <path d="M0 3c5 0 11 10 16 10" class="surface" stroke-width="8"/>
        <path d="M0 3c5 0 11 10 16 10" stroke="currentColor" stroke-width="4.5"/>
        <path d="M0 3c5 0 11 10 16 10" class="surface" stroke-width="1.5"/>
        <path d="M16 13c5 0 11-10 16-10" stroke="currentColor" stroke-width="4.5"/>
        <path d="M16 13c5 0 11-10 16-10" class="surface" stroke-width="1.5"/>
        <path d="M16 3c5 0 11 10 16 10" class="surface" stroke-width="8"/>
        <path d="M16 3c5 0 11 10 16 10" stroke="currentColor" stroke-width="4.5"/>
        <path d="M16 3c5 0 11 10 16 10" class="surface" stroke-width="1.5"/>
      </g>
    </pattern>
  </defs>
  <rect width="1600" height="480" class="bg"/>
  <rect x="0" y="20" width="1600" height="16" fill="url(#plait)"/>
  <rect x="0" y="444" width="1600" height="16" fill="url(#plait)"/>
  <g class="engraving"><image href="../../apps/web/src/art/nornen.webp" x="1180" y="52" width="316" height="384"/></g>
  <!-- ᚹᛖᚱᚦᚨᚾᛞᛁ, ui/runes.tsx's glyphs on their 16-unit grid. -->
  <g class="runes" transform="translate(104 96) scale(1.75)">
    <path d="M5 14V2l5.5 3L5 8" transform="translate(-2 0)"/>
    <path d="M4 14V2l4 4 4-4v12" transform="translate(10 0)"/>
    <path d="M5 14V2l5.5 3L5 8l6 6" transform="translate(22 0)"/>
    <path d="M5 2v12M5 5l5.5 3L5 11" transform="translate(34 0)"/>
    <path d="M5.5 2v12M5.5 2l5.5 4M5.5 6.5l5.5 4" transform="translate(46 0)"/>
    <path d="M8 2v12M5 6l6 4" transform="translate(58 0)"/>
    <path d="M3 2v12M13 2v12M3 2l10 12M13 2L3 14" transform="translate(70 0)"/>
    <path d="M8 2v12" transform="translate(82 0)"/>
  </g>
  <text x="296" y="116" class="eyebrow">VERÐANDI · WHAT IS BECOMING</text>
  <text x="96" y="282" class="title">VERDANDI</text>
  <text x="104" y="338" class="tag">Every task goes to the harness, model and effort</text>
  <text x="104" y="378" class="tag">that finish it for the least.</text>
</svg>
