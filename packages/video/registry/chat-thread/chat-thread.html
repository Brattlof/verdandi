<template>
  <div
    id="chat-thread-root"
    data-composition-id="chat-thread"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[{"id":"messages","type":"string","label":"Messages (JSON)","default":"[{\"from\":\"me\",\"text\":\"Did the deploy go out?\"},{\"from\":\"them\",\"text\":\"Yes, about ten minutes ago.\"},{\"from\":\"me\",\"text\":\"Any errors?\"},{\"from\":\"them\",\"text\":\"None so far. Tests passed and the dashboards look clean.\"},{\"from\":\"me\",\"text\":\"Perfect, thanks!\"}]"},{"id":"accent","type":"color","label":"Your bubbles","default":"#e0a458"},{"id":"ink","type":"color","label":"Ink","default":"#f4f1ea"}]'
  >
    <style>
      .viewport { position: absolute; top: 0; bottom: 0; left: 410px; width: 1100px; font-family: system-ui, sans-serif; -webkit-mask-image: linear-gradient(to bottom, transparent 40px, #000 240px); mask-image: linear-gradient(to bottom, transparent 40px, #000 240px); }
      .feed { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-direction: column; gap: 18px; }
      .bubble { max-width: 780px; padding: 22px 34px; border-radius: 38px; font-size: 42px; line-height: 1.3; overflow-wrap: anywhere; }
      .me { align-self: flex-end; border-bottom-right-radius: 10px; background: var(--accent, #e0a458); color: #0b0b0c; transform-origin: 100% 100%; }
      .them { align-self: flex-start; border-bottom-left-radius: 10px; background: color-mix(in srgb, var(--ink, #f4f1ea) 14%, transparent); color: var(--ink, #f4f1ea); transform-origin: 0% 100%; }
      .typing { position: absolute; left: 0; display: flex; gap: 12px; align-items: center; height: 88px; padding: 0 34px; }
      .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--ink, #f4f1ea); opacity: 0.6; }
    </style>
    <div class="viewport">
      <div class="feed"></div>
    </div>
    <script>
      const vars = __verdandi.getVariables();
      let messages = [];
      try {
        messages = JSON.parse(String(vars.messages));
      } catch {
        console.warn("[chat-thread] messages isn't valid JSON; expected [{\"from\":\"me\",\"text\":\"Hi\"}, {\"from\":\"them\",\"text\":\"Hello\"}]");
      }
      if (!Array.isArray(messages)) messages = [];
      messages = messages
        .filter((m) => m && typeof m === "object" && String(m.text ?? "").trim())
        .slice(0, 14)
        .map((m) => ({ me: m.from === "me", text: String(m.text) }));

      // Lay the whole thread out once; the feed then scrolls (a y transform) so the newest bubble's bottom sits on
      // the baseline, and anything that reaches the top fades under the viewport's mask.
      const feed = document.querySelector(".feed");
      const bubbles = messages.map((m) => {
        const b = document.createElement("div");
        b.className = `bubble ${m.me ? "me" : "them"}`;
        b.textContent = m.text;
        feed.append(b);
        return b;
      });
      const typing = bubbles.map((b, i) => {
        if (messages[i].me) return null;
        const t = document.createElement("div");
        t.className = "bubble them typing";
        t.style.top = `${b.offsetTop}px`;
        for (let k = 0; k < 3; k++) t.append(Object.assign(document.createElement("span"), { className: "dot" }));
        feed.append(t);
        return t;
      });

      // A short thread ends centred on the frame; a long one keeps its newest bubble near the bottom.
      const height = bubbles.length ? bubbles.at(-1).offsetTop + bubbles.at(-1).offsetHeight : 0;
      const baseline = Math.round(Math.min(900, 540 + height / 2));
      const tl = gsap.timeline({ paused: true });
      let y = baseline;
      let gone = 0;
      const scrollTo = (bottom, at, shown) => {
        const next = baseline - bottom;
        if (next !== y) tl.fromTo(feed, { y }, { y: next, duration: 0.45, ease: "power3.out", immediateRender: false }, at);
        y = next;
        // A bubble scrolled past the top of the frame fades out as it leaves, under the mask, on purpose.
        for (; gone < shown && bubbles[gone].offsetTop + y < 0; gone++) {
          bubbles[gone].setAttribute("data-layout-ignore", "");
          tl.fromTo(bubbles[gone], { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power1.out", immediateRender: false }, at);
        }
      };
      tl.set(feed, { y }, 0);
      tl.set([...bubbles, ...typing.filter(Boolean)], { opacity: 0 }, 0);

      const words = (s) => s.trim().split(/\s+/).length;
      let t = 0.3;
      messages.forEach((m, i) => {
        const b = bubbles[i];
        const dots = typing[i];
        if (dots) {
          // A typing indicator, longer for longer replies, its dots bouncing in turn.
          const wait = Math.min(Math.max(0.5 + m.text.length * 0.012, 0.8), 1.6);
          scrollTo(b.offsetTop + dots.offsetHeight, t, i);
          tl.fromTo(dots, { opacity: 0, scale: 0.8, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, t);
          const cycles = Math.max(1, Math.floor((wait - 0.1) / 0.6));
          dots.querySelectorAll(".dot").forEach((d, k) => {
            tl.fromTo(d, { y: 0 }, { keyframes: [{ y: -12, duration: 0.18, ease: "sine.out" }, { y: 0, duration: 0.18, ease: "sine.in" }, { y: 0, duration: 0.24 }], repeat: cycles - 1, immediateRender: false }, t + 0.1 + k * 0.12);
          });
          t += wait;
          tl.to(dots, { opacity: 0, duration: 0.12, ease: "power1.in" }, t);
        }
        tl.fromTo(b, { opacity: 0, scale: 0.86, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, t);
        scrollTo(b.offsetTop + b.offsetHeight, t, i);
        // Hold long enough to read it: about four words a second, plus half a second.
        t += Math.min(Math.max(0.5 + words(m.text) * 0.22, 0.9), 2.4);
      });
      window.__timelines["chat-thread"] = tl;
    </script>
  </div>
</template>
