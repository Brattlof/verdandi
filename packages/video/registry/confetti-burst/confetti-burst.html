<template>
  <div
    id="confetti-burst-root"
    data-composition-id="confetti-burst"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[{"id":"colors","type":"string","label":"Colours (JSON list)","default":"[\"#e0a458\",\"#f4f1ea\",\"#d1495b\",\"#2e86ab\",\"#66a182\",\"#9b72cf\"]"},{"id":"count","type":"number","label":"Pieces (20 to 200)","default":80},{"id":"seed","type":"number","label":"Seed (another number, another burst)","default":7}]'
  >
    <style>
      .field { position: absolute; inset: 0; pointer-events: none; }
      .bit { position: absolute; left: 960px; top: 540px; will-change: transform, opacity; }
      .bit.round { border-radius: 50%; }
      .bit.rect { border-radius: 2px; }
    </style>
    <div class="field" aria-hidden="true"></div>
    <script>
      const vars = __verdandi.getVariables();
      let colors = vars.colors;
      if (typeof colors === "string") {
        try { colors = JSON.parse(colors); } catch { console.warn("[confetti-burst] colors isn't valid JSON; expected [\"#e0a458\", …]"); colors = []; }
      }
      colors = (Array.isArray(colors) ? colors : []).filter((c) => typeof c === "string" && c.trim());
      if (!colors.length) colors = ["#e0a458", "#f4f1ea", "#d1495b", "#2e86ab", "#66a182", "#9b72cf"];
      const count = Math.min(Math.max(Math.round(Number(vars.count) || 80), 20), 200);

      // Seeded, so every render (and every seek) draws the same burst.
      const mulberry32 = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const rand = mulberry32(Math.round(Number(vars.seed) || 7));
      const between = (a, b) => a + (b - a) * rand();

      const shapes = [
        { cls: "rect", w: 14, h: 26 },
        { cls: "rect", w: 9, h: 34 },
        { cls: "rect", w: 16, h: 16 },
        { cls: "round", w: 15, h: 15 },
      ];
      const field = document.querySelector(".field");
      const gravity = 1050;
      const pieces = Array.from({ length: count }, (_, i) => {
        const shape = shapes[Math.floor(rand() * shapes.length)];
        const el = document.createElement("div");
        el.className = `bit ${shape.cls}`;
        const scale = between(1, 1.5);
        el.style.width = `${shape.w * scale}px`;
        el.style.height = `${shape.h * scale}px`;
        el.style.marginLeft = `${(-shape.w * scale) / 2}px`;
        el.style.marginTop = `${(-shape.h * scale) / 2}px`;
        el.style.background = colors[i % colors.length];
        field.append(el);
        // Mostly upward, fanned out to both sides; a few fly low and wide.
        const angle = (-90 + between(-78, 78)) * (Math.PI / 180);
        const speed = between(900, 2100) * (1 - 0.35 * Math.abs(Math.cos(angle)) * rand());
        return {
          el,
          delay: between(0, 0.07),
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          drag: between(1.9, 2.8),
          spin: between(-540, 540),
          rot: between(0, 360),
          flip: between(5, 11),
          phase: between(0, Math.PI * 2),
          sway: between(18, 48),
          swayRate: between(2.5, 4.5),
          fadeAt: between(2.3, 2.6),
        };
      });

      // Linear drag towards a terminal falling speed: x and y follow from the time alone, never from the last frame.
      const clock = { t: 0 };
      const draw = () => {
        for (const p of pieces) {
          const t = Math.max(clock.t - p.delay, 0);
          const decay = 1 - Math.exp(-p.drag * t);
          const fall = gravity / p.drag;
          const x = (p.vx / p.drag) * decay + Math.sin(p.swayRate * t + p.phase) * p.sway * decay;
          const y = ((p.vy - fall) / p.drag) * decay + fall * t;
          const pop = Math.min(t / 0.08, 1);
          const fade = Math.min(Math.max((3 - clock.t) / (3 - p.fadeAt), 0), 1);
          p.el.style.opacity = String(clock.t <= p.delay ? 0 : Math.min(pop * 1.5, 1) * fade);
          p.el.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) rotate(${(p.rot + p.spin * t).toFixed(2)}deg) scale(${(0.4 + 0.6 * pop).toFixed(3)}, ${(0.4 + 0.6 * pop) * Math.cos(p.flip * t + p.phase)})`;
        }
      };
      draw();

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: 3, duration: 3, ease: "none", onUpdate: draw }, 0);
      window.__timelines["confetti-burst"] = tl;
    </script>
  </div>
</template>
