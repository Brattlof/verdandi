<template>
  <div
    id="logo-sting-root"
    data-composition-id="logo-sting"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[{"id":"text","type":"string","label":"Wordmark","default":"VERDANDI"},{"id":"accent","type":"color","label":"Accent","default":"#e0a458"},{"id":"ink","type":"color","label":"Ink","default":"#f4f1ea"}]'
  >
    <style>
      .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; color: var(--ink, #f4f1ea); }
      .ring { position: absolute; left: 50%; top: 50%; width: 600px; height: 600px; margin: -300px 0 0 -300px; border-radius: 50%; border: 6px solid var(--accent, #e0a458); }
      .ring.two { border-width: 3px; }
      .flash { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--accent, #e0a458) 55%, transparent), transparent); }
      .word { position: relative; margin: 0; padding: 0 80px; font-size: 168px; font-weight: 900; letter-spacing: 0.06em; margin-right: -0.06em; line-height: 1; white-space: nowrap; }
      .underline { position: absolute; left: 50%; top: calc(50% + 120px); width: 240px; height: 8px; margin-left: -120px; border-radius: 4px; background: var(--accent, #e0a458); }
    </style>
    <div class="stage">
      <div class="flash"></div>
      <div class="ring one"></div>
      <div class="ring two"></div>
      <h1 class="word" data-var-text="text" data-layout-ignore>VERDANDI</h1>
      <div class="underline"></div>
    </div>
    <script>
      // Long wordmarks shrink to fit the frame once settled; the slam starts past its edges on purpose (data-layout-ignore).
      const word = document.querySelector(".word");
      const fit = Math.min(1, 1760 / Math.max(word.scrollWidth, 1));
      word.style.fontSize = `${Math.floor(168 * fit)}px`;

      const impact = 0.4;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".word", { opacity: 0, scale: 2.6 }, { opacity: 1, scale: 1, duration: impact - 0.05, ease: "power4.in" }, 0.05)
        // The hit: a squash and a little recoil.
        .to(".word", { scale: 1.06, duration: 0.08, ease: "power2.out" }, impact)
        .to(".word", { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.45)" }, impact + 0.08)
        .fromTo(".flash", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" }, impact)
        .to(".flash", { opacity: 0, scale: 1.5, duration: 0.7, ease: "power2.out" }, impact + 0.12)
        // Rings start hidden (fromTo renders its from-state before it starts, and again when scrubbed back), appear on the hit, then expand out.
        .fromTo(".ring", { opacity: 0, scale: 0.3 }, { opacity: 1, duration: 0.01 }, impact)
        .to(".ring.one", { opacity: 0, scale: 2.6, duration: 1.1, ease: "power3.out" }, impact + 0.01)
        .to(".ring.two", { opacity: 0, scale: 3.4, duration: 1.3, ease: "power3.out" }, impact + 0.12)
        .fromTo(".underline", { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, impact + 0.15)
        .to(".word", { letterSpacing: "0.1em", duration: 1.05, ease: "none" }, impact + 0.6)
        .to([".word", ".underline"], { opacity: 0, scale: 0.85, duration: 0.35, ease: "power3.in" }, 2.05);
      window.__timelines["logo-sting"] = tl;
    </script>
  </div>
</template>
