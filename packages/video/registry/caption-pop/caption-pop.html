<template>
  <div
    id="caption-pop-root"
    data-composition-id="caption-pop"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[{"id":"words","type":"string","label":"Words (JSON [{text,start,end}] in seconds)","default":"[{\"text\":\"Say\",\"start\":0.3,\"end\":0.65},{\"text\":\"it\",\"start\":0.7,\"end\":1.01},{\"text\":\"one\",\"start\":1.07,\"end\":1.42},{\"text\":\"word\",\"start\":1.48,\"end\":1.86},{\"text\":\"at\",\"start\":1.92,\"end\":2.23},{\"text\":\"a\",\"start\":2.29,\"end\":2.56},{\"text\":\"time.\",\"start\":2.62,\"end\":3.0},{\"text\":\"Each\",\"start\":3.52,\"end\":3.9},{\"text\":\"word\",\"start\":3.96,\"end\":4.33},{\"text\":\"lands\",\"start\":4.4,\"end\":4.81},{\"text\":\"on\",\"start\":4.87,\"end\":5.18},{\"text\":\"its\",\"start\":5.24,\"end\":5.58},{\"text\":\"beat,\",\"start\":5.65,\"end\":6.03},{\"text\":\"big\",\"start\":6.09,\"end\":6.43},{\"text\":\"and\",\"start\":6.49,\"end\":6.84},{\"text\":\"bold.\",\"start\":6.9,\"end\":7.28}]"},{"id":"color","type":"color","label":"Text","default":"#15130f"},{"id":"box","type":"color","label":"Box","default":"#ffd166"}]'
  >
    <style>
      .stage { position: absolute; left: 0; right: 0; bottom: 150px; height: 220px; font-family: system-ui, sans-serif; }
      .word {
        position: absolute; left: 50%; bottom: 0; transform-origin: 50% 85%; white-space: nowrap;
        padding: 10px 40px 18px; border-radius: 26px; background: var(--box, #ffd166); color: var(--color, #15130f);
        font-size: 132px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.05; text-transform: uppercase;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
    </style>
    <div class="stage"></div>
    <script>
      // Each word's entrance and exit are tweens at its own times, so any frame can be seeked to.
      const vars = __verdandi.getVariables();
      let words = vars.words;
      if (typeof words === "string") {
        try {
          words = JSON.parse(words);
        } catch {
          console.warn("[caption-pop] words isn't valid JSON; expected [{\"text\":\"Hi\",\"start\":0.3,\"end\":0.6}, …]");
          words = [];
        }
      }
      words = (Array.isArray(words) ? words : [])
        .filter((w) => w && typeof w.text === "string" && w.text.trim() && Number.isFinite(+w.start) && Number.isFinite(+w.end))
        .map((w) => ({ text: w.text.trim(), start: +w.start, end: Math.max(+w.end, +w.start + 0.05) }))
        .sort((a, b) => a.start - b.start);

      const stage = document.querySelector(".stage");
      const tilts = [-3, 2, -1.5, 2.5, -2];
      const tl = gsap.timeline({ paused: true });
      for (const [i, w] of words.entries()) {
        const el = document.createElement("div");
        el.className = "word";
        el.textContent = w.text;
        stage.append(el);
        // A word holds through short gaps until the next one lands, and leaves a third of a second after a long one.
        const next = words[i + 1];
        const out = next ? Math.min(next.start, w.end + 0.35) : w.end + 0.35;
        const rotation = tilts[i % tilts.length];
        tl.fromTo(el, { xPercent: -50, scale: 0.35, y: 30, rotation: 0 }, { xPercent: -50, scale: 1, y: 0, rotation, duration: 0.26, ease: "back.out(3.2)" }, w.start)
          .fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, w.start)
          .to(el, { opacity: 0, scale: 0.9, duration: next && out === next.start ? 0.04 : 0.16, ease: "power1.in" }, out);
      }
      window.__timelines["caption-pop"] = tl;
    </script>
  </div>
</template>
