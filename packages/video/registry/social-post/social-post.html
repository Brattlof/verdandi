<template>
  <div
    id="social-post-root"
    data-composition-id="social-post"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[{"id":"name","type":"string","label":"Display name","default":"Ada Lovelace"},{"id":"handle","type":"string","label":"Handle","default":"@ada"},{"id":"time","type":"string","label":"Posted","default":"2h"},{"id":"text","type":"string","label":"Post text","default":"Rendered our whole launch video from one HTML file. Every frame lands exactly where the timeline says it should."},{"id":"likes","type":"number","label":"Likes","default":12480},{"id":"reposts","type":"number","label":"Reposts","default":1893},{"id":"accent","type":"color","label":"Accent","default":"#e0565b"}]'
  >
    <style>
      .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
      .card {
        width: 1080px; padding: 52px 60px 40px; border-radius: 36px; background: #ffffff; color: #14171a;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(0, 0, 0, 0.06);
      }
      .head { display: flex; align-items: center; gap: 26px; }
      .avatar {
        flex: none; width: 104px; height: 104px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        background: #2a2724; color: #f4f1ea; font-size: 40px; font-weight: 700; letter-spacing: 0.02em;
      }
      .who { flex: 1; min-width: 0; }
      .name { margin: 0; font-size: 42px; font-weight: 750; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .meta { margin: 4px 0 0; font-size: 32px; color: #6b7177; white-space: nowrap; }
      .more { flex: none; width: 44px; height: 44px; color: #8b9196; }
      .text { margin: 36px 0 0; font-size: 50px; line-height: 1.32; letter-spacing: -0.005em; }
      .rule { height: 2px; margin: 40px 0 28px; background: #e8eaec; transform-origin: left center; }
      .actions { display: flex; justify-content: space-between; padding-right: 12px; color: #5b6166; font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .act { display: flex; align-items: center; gap: 14px; }
      .icon { position: relative; width: 44px; height: 44px; }
      .icon svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .heart-fill { fill: var(--accent, #e0565b); }
      .count { min-width: 3.2em; }
    </style>
    <div class="stage">
      <div class="card">
        <div class="head">
          <div class="avatar"></div>
          <div class="who">
            <p class="name" data-var-text="name">Ada Lovelace</p>
            <p class="meta"><span data-var-text="handle">@ada</span> · <span data-var-text="time">2h</span></p>
          </div>
          <svg class="more" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="19" cy="12" r="2" /></svg>
        </div>
        <p class="text" data-var-text="text">Rendered our whole launch video from one HTML file. Every frame lands exactly where the timeline says it should.</p>
        <div class="rule"></div>
        <div class="actions">
          <div class="act">
            <div class="icon">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 4v-4h0A1.5 1.5 0 0 1 4 14.5z" /></svg>
            </div>
          </div>
          <div class="act repost">
            <div class="icon">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V8.5A2.5 2.5 0 0 1 6.5 6H19M16 3l3 3-3 3M20 13v2.5a2.5 2.5 0 0 1-2.5 2.5H5M8 21l-3-3 3-3" /></svg>
            </div>
            <span class="count reposts">0</span>
          </div>
          <div class="act">
            <div class="icon">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path class="heart-line" d="M12 20s-7.2-4.5-9.1-8.9C1.6 7.9 3.6 4.5 7 4.5c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.4 0 5.4 3.4 4.1 6.6C19.2 15.5 12 20 12 20z" /></svg>
              <svg class="heart" aria-hidden="true" viewBox="0 0 24 24"><path class="heart-fill" d="M12 20s-7.2-4.5-9.1-8.9C1.6 7.9 3.6 4.5 7 4.5c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.4 0 5.4 3.4 4.1 6.6C19.2 15.5 12 20 12 20z" /></svg>
            </div>
            <span class="count likes">0</span>
          </div>
          <div class="act">
            <div class="icon">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13" /></svg>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const vars = __verdandi.getVariables();
      const len = Math.max(Number(__verdandi.duration()) || 6, 3);
      const initials = String(vars.name ?? "")
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map((w) => w.charAt(0).toUpperCase())
        .join("");
      document.querySelector(".avatar").textContent = initials || "?";

      // A count that ends below 10,000 shows in full with separators, a bigger one compact (12.5K), in a fixed locale.
      const full = new Intl.NumberFormat("en-US");
      const compact = new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 });
      const counter = (selector, target) => {
        const el = document.querySelector(selector);
        const end = Math.max(0, Number(target) || 0);
        const fmt = end < 10000 ? full : compact;
        const state = { v: Math.round(end * 0.72) };
        const write = () => {
          el.textContent = fmt.format(Math.round(state.v));
        };
        write();
        return { end, state, write };
      };
      const reposts = counter(".reposts", vars.reposts);
      const likes = counter(".likes", vars.likes);

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      tl.fromTo(".card", { opacity: 0, y: 90, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.8 }, 0)
        .fromTo(".avatar", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2)" }, 0.25)
        .fromTo([".name", ".meta"], { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, stagger: 0.08 }, 0.3)
        .fromTo(".text", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6 }, 0.5)
        .fromTo(".rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6 }, 0.75)
        .fromTo(".act", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.07 }, 0.85);

      // Counts climb over the hold, fast at first; the heart fills and pops as likes start moving.
      const climb = Math.max(len - 2.4, 1);
      tl.to(reposts.state, { v: reposts.end, duration: climb, ease: "power2.out", onUpdate: reposts.write }, 1.3)
        .to(likes.state, { v: likes.end, duration: climb, ease: "power2.out", onUpdate: likes.write }, 1.4)
        .fromTo(".heart", { scale: 0, transformOrigin: "50% 55%" }, { scale: 1, duration: 0.5, ease: "back.out(3)" }, 1.4)
        .fromTo(".likes", { color: "#5b6166" }, { color: vars.accent || "#e0565b", duration: 0.3, ease: "power1.out" }, 1.4)
        .to(".card", { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, len - 0.6);
      window.__timelines["social-post"] = tl;
    </script>
  </div>
</template>
