<template>
  <div
    id="map-pin-root"
    data-composition-id="map-pin"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[{"id":"place","type":"string","label":"Place","default":"Verdandi HQ"},{"id":"detail","type":"string","label":"Detail","default":"Storgatan 12, Stockholm"},{"id":"accent","type":"color","label":"Pin colour","default":"#e0a458"},{"id":"seed","type":"number","label":"Street plan seed","default":7}]'
  >
    <style>
      .scene { position: absolute; inset: 0; overflow: hidden; background: #3a3d44; font-family: system-ui, sans-serif; }
      .map { position: absolute; inset: 0; transform-origin: 960px 600px; }
      .map svg { position: absolute; inset: 0; overflow: visible; }
      .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 75% at 50% 55%, rgba(12, 13, 16, 0) 40%, rgba(12, 13, 16, 0.82) 100%); }
      .pin-shadow { position: absolute; left: 924px; top: 588px; width: 72px; height: 24px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0)); }
      .ripple { position: absolute; left: 900px; top: 540px; width: 120px; height: 120px; border-radius: 50%; border: 5px solid var(--accent, #e0a458); }
      .pin { position: absolute; left: 914px; top: 474px; width: 92px; height: 126px; transform-origin: 50% 100%; }
      .pin svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.35)); }
      .pin-body { fill: var(--accent, #e0a458); }
      .card {
        position: absolute; left: 1036px; top: 434px; max-width: 760px; padding: 30px 40px 32px; border-radius: 24px;
        background: #f4f1ea; color: #1b1a18; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }
      .card::before {
        content: ""; position: absolute; left: -14px; top: calc(50% - 14px); width: 28px; height: 28px; background: #f4f1ea; transform: rotate(45deg); border-radius: 4px;
      }
      .place { position: relative; margin: 0; font-size: 56px; font-weight: 750; letter-spacing: -0.01em; line-height: 1.1; white-space: nowrap; }
      .detail { position: relative; margin: 10px 0 0; font-size: 34px; color: #6b665e; white-space: nowrap; }
    </style>
    <div class="scene">
      <div class="map"><svg aria-hidden="true" width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div>
      <div class="vignette"></div>
      <div class="ripple r1"></div>
      <div class="ripple r2"></div>
      <div class="pin-shadow"></div>
      <div class="pin">
        <svg aria-hidden="true" viewBox="0 0 92 126">
          <path class="pin-body" d="M46 124C46 124 6 74 6 44a40 40 0 0 1 80 0c0 30-40 80-40 80z" />
          <circle cx="46" cy="44" r="16" fill="#1b1a18" />
        </svg>
      </div>
      <div class="card">
        <p class="place" data-var-text="place">Verdandi HQ</p>
        <p class="detail" data-var-text="detail">Storgatan 12, Stockholm</p>
      </div>
    </div>
    <script>
      const vars = __verdandi.getVariables();
      const len = Math.max(Number(__verdandi.duration()) || 6, 3);
      const mulberry32 = (a) => () => {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const rand = mulberry32(Math.round(Number(vars.seed) || 7));
      const between = (lo, hi) => lo + rand() * (hi - lo);

      const NS = "http://www.w3.org/2000/svg";
      const svg = document.querySelector(".map svg");
      const el = (tag, attrs, parent) => {
        const node = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
        parent.append(node);
        return node;
      };
      // The plan is drawn well past the frame and turned around the pin, so the push-in never shows an edge.
      const plan = el("g", { transform: `rotate(${between(-16, -8).toFixed(2)} 960 600)` }, svg);
      const lines = (from, to, lo, hi) => {
        const out = [from];
        while (out.at(-1) < to) out.push(out.at(-1) + between(lo, hi));
        return out;
      };
      const xs = lines(-700, 2620, 100, 190);
      const ys = lines(-700, 1780, 80, 150);

      const blocks = el("g", {}, plan);
      for (let i = 0; i < xs.length - 1; i++) {
        for (let j = 0; j < ys.length - 1; j++) {
          const x = xs[i] + 9, y = ys[j] + 9, w = xs[i + 1] - xs[i] - 18, h = ys[j + 1] - ys[j] - 18;
          const roll = rand();
          if (roll < 0.07) {
            el("rect", { x, y, width: w, height: h, rx: 6, fill: "#26332a" }, blocks);
          } else if (roll < 0.32 && w > 90) {
            // Some blocks are split into two lots by an alley.
            const cut = w * between(0.35, 0.65);
            el("rect", { x, y, width: cut - 3, height: h, rx: 3, fill: "#202227" }, blocks);
            el("rect", { x: x + cut + 3, y, width: w - cut - 3, height: h, rx: 3, fill: "#23252b" }, blocks);
          } else {
            el("rect", { x, y, width: w, height: h, rx: 3, fill: roll < 0.6 ? "#202227" : "#23252b" }, blocks);
          }
        }
      }

      // A river winds across the lower half, under the avenues that bridge it.
      const water = el("g", {}, plan);
      const ry = between(820, 900);
      let river = `M-800 ${ry.toFixed(0)}`;
      for (let x = -800; x < 2700; x += 500) river += ` S${x + 380} ${(ry + between(-110, 110)).toFixed(0)} ${x + 500} ${(ry + between(-70, 70)).toFixed(0)}`;
      el("path", { d: river, fill: "none", stroke: "#2b3443", "stroke-width": 132, "stroke-linecap": "round" }, water);
      el("path", { d: river, fill: "none", stroke: "#1a2433", "stroke-width": 110, "stroke-linecap": "round" }, water);

      // Every few grid lines is a wide avenue, plus one boulevard on a diagonal; these draw on as the map settles.
      const roads = el("g", { fill: "none", stroke: "#50545d", "stroke-linecap": "round" }, plan);
      const avenues = [];
      const step = 3 + Math.floor(rand() * 2);
      xs.forEach((x, i) => {
        if (i % step === 1) avenues.push(el("path", { d: `M${x} -700 L${x} 1780`, "stroke-width": 26 }, roads));
      });
      ys.forEach((y, j) => {
        if (j % step === 2) avenues.push(el("path", { d: `M-700 ${y} L2620 ${y}`, "stroke-width": 26 }, roads));
      });
      avenues.push(el("path", { d: `M-700 ${between(-200, 200).toFixed(0)} L2620 ${between(1300, 1700).toFixed(0)}`, "stroke-width": 30 }, roads));

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      tl.fromTo(".map", { opacity: 0, scale: 1.18, rotation: 3 }, { opacity: 1, scale: 1, rotation: 0, duration: 1.6 }, 0)
        .to(".map", { scale: 1.07, duration: Math.max(len - 1.6, 0.5), ease: "sine.inOut" }, 1.6);
      for (const road of avenues) {
        const length = road.getTotalLength();
        tl.fromTo(road, { strokeDasharray: length, strokeDashoffset: length }, { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, 0.2 + rand() * 0.4);
      }

      // The pin falls, squashes on landing and springs back; a shadow tightens under it and two rings ripple out.
      const land = 1.45;
      tl.fromTo(".pin", { y: -620, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.in" }, land - 0.55)
        .fromTo(".pin-shadow", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.in" }, land - 0.55)
        .fromTo(".pin", { scaleX: 1, scaleY: 1 }, { scaleX: 1.16, scaleY: 0.8, duration: 0.09, ease: "power2.out", immediateRender: false }, land)
        .to(".pin", { scaleX: 1, scaleY: 1, duration: 0.6, ease: "elastic.out(1.1, 0.45)" }, land + 0.09)
        .fromTo(".r1", { scale: 0, opacity: 0.9 }, { scale: 2.6, opacity: 0, duration: 1.1, ease: "power2.out" }, land)
        .fromTo(".r2", { scale: 0, opacity: 0.7 }, { scale: 2.6, opacity: 0, duration: 1.1, ease: "power2.out" }, land + 0.3)
        .fromTo(".card", { opacity: 0, x: -30, scale: 0.94, transformOrigin: "0% 50%" }, { opacity: 1, x: 0, scale: 1, duration: 0.6 }, land + 0.25)
        .fromTo([".place", ".detail"], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.1 }, land + 0.4);
      window.__timelines["map-pin"] = tl;
    </script>
  </div>
</template>
